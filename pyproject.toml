[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-anomaly-detection"
version = "0.1.0"
description = "Normal-only feature selection and explainable multi-scale PatchCore research"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "torchvision>=0.20,<1", "numpy>=2.0", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2", "matplotlib>=3.8", "Pillow>=10", "PyYAML>=6", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
faiss = ["faiss-cpu>=1.8"]

[tool.setuptools.packages.find]
include = ["iad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
